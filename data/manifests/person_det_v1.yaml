# data/manifests/person_det_v1.yaml
dataset_name: woodscape_person_v1
source: woodscape_training_set
total_images: 8234
images_with_person: 5601
images_without_person: 2633
classes:
  - person
split:
  train: 0.9
  val: 0.1
split_seed: 42
notes: >
  All images retained, including person-free frames (hard negatives).
  Original WoodScape multi-class annotations filtered to 'person' only
  at training-config time, not at manifest time — raw labels preserved.
  Official WoodScape test set is separate and held out entirely —
  not included in this manifest, not touched during iteration.