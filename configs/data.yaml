# Ultralytics dataset config for WoodScape fisheye person detection.
# `path` is relative to the repo root. Ultralytics resolves it against its
# global `datasets_dir` setting, so the training entrypoint sets that to the
# repo root at runtime (see src/train/paths.py). Do not hardcode absolutes.

path: data/yolo
train: images/train
val: images/val

names:
  0: person