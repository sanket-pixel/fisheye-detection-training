# configs/yolo26n_baseline.yaml
# Baseline training config: YOLO26 nano, single-class person detection on
# WoodScape fisheye imagery.
#
# Augmentation notes (fisheye-specific):
#   - mosaic OFF: stitches 4 images into one, producing physically impossible
#     lens geometry at the seams. Deliberate baseline choice; flipping it on
#     is experiment #2, not a default.
#   - fliplr ON: harmless-to-helpful here; the four camera positions already
#     span mirrored viewpoints (MVL/MVR).
#   - flipud OFF: vertically flipped ground-level scenes don't occur.
#   - rotation kept small: large rotations break the radial distortion
#     structure the model needs to learn.

model: yolo26n.pt          # COCO-pretrained; transfer learning, not from scratch
data: configs/data.yaml

# --- run length / schedule ---
epochs: 100
patience: 20               # early stop if val mAP plateaus
batch: 16
imgsz: 640
seed: 42                   # reproducibility; pinned alongside git commit

# --- optimizer ---
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

# --- augmentation ---
hsv_h: 0.015               # colour jitter, safe for fisheye
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0               # small rotation only
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0           # off: fisheye is already non-perspective
flipud: 0.0
fliplr: 0.5
mosaic: 0.0                # OFF for baseline (see note above)
mixup: 0.0
copy_paste: 0.0

# --- output ---
project: runs
name: yolo26n_baseline
exist_ok: false            # never silently overwrite a previous run